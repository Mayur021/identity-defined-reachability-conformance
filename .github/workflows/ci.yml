name: conformance

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: fixtures and harness validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixtures parse and every property is covered
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import yaml, re, sys
          fx = yaml.safe_load(open('fixtures/idr.yaml'))
          ids = {f['property'] for f in fx}
          declared = set(re.findall(r'^## (IDR-P\d+)', open('properties/IDR-PROPERTIES.md').read(), re.M))
          missing = declared - ids
          extra = ids - declared
          print(f"{len(declared)} properties declared, {len(fx)} fixtures")
          if missing or extra:
              print("MISMATCH  missing fixture:", missing, " undeclared property:", extra); sys.exit(1)
          for f in fx:
              assert 'expect' in f and 'outcome' in f['expect'], f"{f['id']} has no expected outcome"
              assert f.get('fails_if'), f"{f['id']} declares no failure conditions"
          print("every property has a fixture, an expected outcome, and failure conditions")
          PY
      - name: Prose count matches the property count
        run: |
          python - <<'PY'
          import re, sys, glob
          n = len(re.findall(r'^## (IDR-P\d+)', open('properties/IDR-PROPERTIES.md').read(), re.M))
          words = {1:'one',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine',10:'ten'}
          wrong = [w for k, w in words.items() if k != n]
          # Only the total-count claim: "<word> properties" or "<word> fixtures".
          # "Five of the nine properties" is fine, the claim there is "nine properties".
          bad = []
          for f in sorted(set(glob.glob('*.md') + glob.glob('*/*.md'))):
              for i, line in enumerate(open(f), 1):
                  for w in wrong:
                      if re.search(rf'\b{w}\s+(properties|fixtures)\b', line, re.I):
                          bad.append(f"{f}:{i}: claims '{w}', suite declares {n} ({words[n]})")
          print(f"{n} properties declared in properties/IDR-PROPERTIES.md")
          if bad:
              print("PROSE DRIFT, a document disagrees with the suite:")
              [print("  ", b) for b in bad]
              sys.exit(1)
          print("no document disagrees with the property count")
          PY
      - name: Harness scripts are syntactically valid
        run: |
          for s in harness/*.sh; do bash -n "$s" && echo "ok  $s"; done
          python -m py_compile harness/session_watch.py && echo "ok  harness/session_watch.py"
      - name: Fingerprint is stable and sensitive
        run: |
          bash harness/fingerprint.sh a /tmp/fp >/dev/null
          bash harness/fingerprint.sh b /tmp/fp >/dev/null
          bash harness/compare.sh /tmp/fp/fp_a /tmp/fp/fp_b
          sudo ip route add 203.0.113.0/24 dev lo
          bash harness/fingerprint.sh c /tmp/fp >/dev/null
          if bash harness/compare.sh /tmp/fp/fp_a /tmp/fp/fp_c; then
            echo "FAIL: fingerprint did not detect an added route"; exit 1
          fi
          sudo ip route del 203.0.113.0/24 dev lo
          echo "fingerprint detected the change, as required"
      - name: Compare refuses a capture altered after it was written
        run: |
          bash harness/fingerprint.sh t1 /tmp/tamper >/dev/null
          cp -r /tmp/tamper/fp_t1 /tmp/tamper/fp_t2
          echo "203.0.113.0/24 dev lo scope link" >> /tmp/tamper/fp_t2/routes
          set +e
          bash harness/compare.sh /tmp/tamper/fp_t1 /tmp/tamper/fp_t2; rc=$?
          set -e
          if [ "$rc" -ne 3 ]; then
            echo "FAIL: an edited component file was not caught by the manifest check (exit $rc, wanted 3)"; exit 1
          fi
          echo "an altered capture is refused as evidence, as required"
      - name: Relocation adjudicator decides P3 conjunctively
        run: |
          mk() {  # mk <dir> <egress> <access> <reenrol> <newcred> <fpsrc>
            mkdir -p "$1"
            printf 'vantage_id: %s\nobserver_source: external\nobserved_egress: %s\n' "$(basename "$1")" "$2" > "$1/vantage"
            printf 'access: %s\nreenrolment: %s\nnew_credential: %s\n' "$3" "$4" "$5" > "$1/access"
            cp -r "$6" "$1/fp"
          }
          bash harness/fingerprint.sh r /tmp/rel >/dev/null
          B=/tmp/rig
          mk $B/a 198.51.100.7 reachable no no /tmp/rel/fp_r
          mk $B/b 203.0.113.9  reachable no no /tmp/rel/fp_r
          mk $B/same 198.51.100.7 reachable no no /tmp/rel/fp_r
          mk $B/gone 203.0.113.9 absent    no no /tmp/rel/fp_r
          mk $B/re   203.0.113.9 reachable yes no /tmp/rel/fp_r
          mk $B/cred 203.0.113.9 reachable no yes /tmp/rel/fp_r
          mk $B/ne   NOT_ESTABLISHED reachable no no /tmp/rel/fp_r
          check() {  # check <want> <dir>
            set +e; bash harness/relocate.sh $B/a "$2" >/dev/null 2>&1; rc=$?; set -e
            if [ "$rc" -ne "$1" ]; then echo "FAIL: $2 gave $rc, wanted $1"; exit 1; fi
            echo "ok  $(basename $2) -> $rc"
          }
          check 0 $B/b
          check 2 $B/same
          check 1 $B/gone
          check 1 $B/re
          check 1 $B/cred
          check 2 $B/ne
          mkdir -p $B/empty && check 2 $B/empty
          echo "P3 is adjudicated conjunctively: access at both ends is necessary and not sufficient"
      - name: Egress refuses a single observer and a split answer
        run: |
          python3 - <<'PY' &
          import http.server, socketserver, threading, time
          def mk(port, body):
              class H(http.server.BaseHTTPRequestHandler):
                  def do_GET(s):
                      s.send_response(200); s.end_headers(); s.wfile.write(body.encode())
                  def log_message(s,*a): pass
              socketserver.TCPServer.allow_reuse_address = True
              socketserver.TCPServer(("127.0.0.1", port), H).serve_forever()
          for p,b in ((18201,"198.51.100.7"),(18202,"198.51.100.7"),(18203,"203.0.113.9")):
              threading.Thread(target=mk, args=(p,b), daemon=True).start()
          time.sleep(60)
          PY
          sleep 3
          set +e
          OBSERVER_URLS="http://127.0.0.1:18201/ http://127.0.0.1:19999/x" EGRESS_TIMEOUT=3 \
            bash harness/egress.sh one /tmp/eg >/dev/null 2>&1; one=$?
          OBSERVER_URLS="http://127.0.0.1:18201/ http://127.0.0.1:18203/" EGRESS_TIMEOUT=3 \
            bash harness/egress.sh split /tmp/eg >/dev/null 2>&1; split=$?
          OBSERVER_URLS="http://127.0.0.1:18201/ http://127.0.0.1:18202/" EGRESS_TIMEOUT=3 \
            bash harness/egress.sh agree /tmp/eg >/dev/null 2>&1; agree=$?
          set -e
          [ "$one"   -eq 2 ] || { echo "FAIL: one observer gave $one, wanted 2"; exit 1; }
          [ "$split" -eq 2 ] || { echo "FAIL: split answer gave $split, wanted 2"; exit 1; }
          [ "$agree" -eq 0 ] || { echo "FAIL: agreeing observers gave $agree, wanted 0"; exit 1; }
          grep -q "observed_egress: 198.51.100.7" /tmp/eg/egress_agree/vantage
          echo "egress is NOT_ESTABLISHED on one observer and on disagreement, observed only on agreement"
